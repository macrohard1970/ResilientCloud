# Containerlab topology: DC-East (us-east-1)
# 2 spines + 4 leaves (FRR), 4 endpoint hosts (Alpine), 1 WAN edge router (FRR)
#
# Deploy:   containerlab deploy -t topology-dc-east.clab.yml
# Destroy:  containerlab destroy -t topology-dc-east.clab.yml --cleanup
# Inspect:  containerlab inspect -t topology-dc-east.clab.yml

name: netlab-east

# Container names equal node names (e.g. dc-east-spine1), unique across regions.
prefix: ""

# ── Management network ────────────────────────────────────────────────
# Every container gets an IP on 10.255.255.0/24 for OOB access.
mgmt:
  network: clab-netlab-east-mgmt
  ipv4-subnet: 10.255.255.0/24

# ── Topology nodes ───────────────────────────────────────────────────
topology:
  nodes:

    # ── Spines (FRR, AS 65001) ────────────────────────────────────────
    dc-east-spine1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.255.255.11
      binds:
        - configs/frr/dc-east-spine1/daemons:/etc/frr/daemons
        - configs/frr/dc-east-spine1/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-east-spine1/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    dc-east-spine2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.255.255.12
      binds:
        - configs/frr/dc-east-spine2/daemons:/etc/frr/daemons
        - configs/frr/dc-east-spine2/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-east-spine2/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    # ── Leaves (FRR, unique ASNs per leaf) ───────────────────────────
    dc-east-leaf1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.255.255.21
      binds:
        - configs/frr/dc-east-leaf1/daemons:/etc/frr/daemons
        - configs/frr/dc-east-leaf1/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-east-leaf1/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    dc-east-leaf2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.255.255.22
      binds:
        - configs/frr/dc-east-leaf2/daemons:/etc/frr/daemons
        - configs/frr/dc-east-leaf2/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-east-leaf2/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    dc-east-leaf3:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.255.255.23
      binds:
        - configs/frr/dc-east-leaf3/daemons:/etc/frr/daemons
        - configs/frr/dc-east-leaf3/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-east-leaf3/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    dc-east-leaf4:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.255.255.24
      binds:
        - configs/frr/dc-east-leaf4/daemons:/etc/frr/daemons
        - configs/frr/dc-east-leaf4/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-east-leaf4/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    # ── WAN edge router (FRR, AS 65010) ──────────────────────────────
    # GRE tunnels to DC-West (wan-west) and DC-EU (wan-eu) are created
    # by tunnels.sh before FRR starts. Remote IPs are passed as env vars.
    wan-east:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.255.255.50
      binds:
        - configs/frr/wan-east/daemons:/etc/frr/daemons
        - configs/frr/wan-east/frr.conf:/etc/frr/frr.conf
        - configs/frr/wan-east/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
        - configs/frr/wan-east/tunnels.sh:/tunnels.sh
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
        # Remote EC2 lab host private IPs, read from the shell environment at
        # deploy time (empty = tunnel skipped). GRE source is set by tunnels.sh.
        REMOTE_WEST: ${REMOTE_WEST:=}
        REMOTE_EU: ${REMOTE_EU:=}
      exec:
        - sh /tunnels.sh
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    # ── Endpoint hosts (Alpine) ──────────────────────────────────────
    dc-east-host-a:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.255.255.31
      binds:
        - configs/hosts/dc-east/dc-east-host-a.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-east-host-b:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.255.255.32
      binds:
        - configs/hosts/dc-east/dc-east-host-b.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-east-host-c:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.255.255.33
      binds:
        - configs/hosts/dc-east/dc-east-host-c.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-east-host-d:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.255.255.34
      binds:
        - configs/hosts/dc-east/dc-east-host-d.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

  # ── Links ──────────────────────────────────────────────────────────
  links:

    # Spine-leaf underlay (OSPF + eBGP)
    - endpoints: ["dc-east-spine1:eth1", "dc-east-leaf1:eth1"]
    - endpoints: ["dc-east-spine1:eth2", "dc-east-leaf2:eth1"]
    - endpoints: ["dc-east-spine1:eth3", "dc-east-leaf3:eth1"]
    - endpoints: ["dc-east-spine1:eth4", "dc-east-leaf4:eth1"]

    - endpoints: ["dc-east-spine2:eth1", "dc-east-leaf1:eth2"]
    - endpoints: ["dc-east-spine2:eth2", "dc-east-leaf2:eth2"]
    - endpoints: ["dc-east-spine2:eth3", "dc-east-leaf3:eth2"]
    - endpoints: ["dc-east-spine2:eth4", "dc-east-leaf4:eth2"]

    # Spine-to-spine (iBGP + OSPF)
    - endpoints: ["dc-east-spine1:eth5", "dc-east-spine2:eth5"]

    # WAN edge uplinks to spines
    - endpoints: ["dc-east-spine1:eth6", "wan-east:eth1"]
    - endpoints: ["dc-east-spine2:eth6", "wan-east:eth2"]

    # Leaf-to-host links (access ports)
    - endpoints: ["dc-east-leaf1:eth3", "dc-east-host-a:eth1"]
    - endpoints: ["dc-east-leaf2:eth3", "dc-east-host-b:eth1"]
    - endpoints: ["dc-east-leaf3:eth3", "dc-east-host-c:eth1"]
    - endpoints: ["dc-east-leaf4:eth3", "dc-east-host-d:eth1"]
