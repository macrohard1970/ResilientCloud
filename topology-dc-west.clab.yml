# Containerlab topology: DC-West (us-west-2)
# 2 spines + 4 leaves (FRR), 4 endpoint hosts (Alpine), 1 WAN edge router (FRR)
#
# Deploy:   containerlab deploy -t topology-dc-west.clab.yml
# Destroy:  containerlab destroy -t topology-dc-west.clab.yml --cleanup
# Inspect:  containerlab inspect -t topology-dc-west.clab.yml

name: netlab-west

# Container names equal node names (e.g. dc-east-spine1), unique across regions.
prefix: ""

# ── Management network ────────────────────────────────────────────────
mgmt:
  network: clab-netlab-west-mgmt
  ipv4-subnet: 10.254.255.0/24

# ── Topology nodes ───────────────────────────────────────────────────
topology:
  nodes:

    # ── Spines (FRR, AS 65001) ────────────────────────────────────────
    dc-west-spine1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.254.255.11
      binds:
        - configs/frr/dc-west-spine1/daemons:/etc/frr/daemons
        - configs/frr/dc-west-spine1/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-west-spine1/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    dc-west-spine2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.254.255.12
      binds:
        - configs/frr/dc-west-spine2/daemons:/etc/frr/daemons
        - configs/frr/dc-west-spine2/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-west-spine2/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    # ── Leaves (FRR, unique ASNs per leaf) ───────────────────────────
    dc-west-leaf1:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.254.255.21
      binds:
        - configs/frr/dc-west-leaf1/daemons:/etc/frr/daemons
        - configs/frr/dc-west-leaf1/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-west-leaf1/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    dc-west-leaf2:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.254.255.22
      binds:
        - configs/frr/dc-west-leaf2/daemons:/etc/frr/daemons
        - configs/frr/dc-west-leaf2/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-west-leaf2/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    dc-west-leaf3:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.254.255.23
      binds:
        - configs/frr/dc-west-leaf3/daemons:/etc/frr/daemons
        - configs/frr/dc-west-leaf3/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-west-leaf3/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    dc-west-leaf4:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.254.255.24
      binds:
        - configs/frr/dc-west-leaf4/daemons:/etc/frr/daemons
        - configs/frr/dc-west-leaf4/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-west-leaf4/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    # ── WAN edge router (FRR, AS 65020) ──────────────────────────────
    wan-west:
      kind: linux
      image: quay.io/frrouting/frr:10.2.1
      mgmt-ipv4: 10.254.255.50
      binds:
        - configs/frr/wan-west/daemons:/etc/frr/daemons
        - configs/frr/wan-west/frr.conf:/etc/frr/frr.conf
        - configs/frr/wan-west/vtysh.conf:/etc/frr/vtysh.conf
        - bin:/opt/rc/bin:ro
        - configs/frr/wan-west/tunnels.sh:/tunnels.sh
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
        # Remote EC2 lab host private IPs, read from the shell environment at
        # deploy time (empty = tunnel skipped). GRE source is set by tunnels.sh.
        REMOTE_EAST: ${REMOTE_EAST:=}
        REMOTE_EU: ${REMOTE_EU:=}
      exec:
        - sh /tunnels.sh
        # frr_exporter (Prometheus metrics on :9342); skipped if bin/frr_exporter is absent
        - sh -c '[ -x /opt/rc/bin/frr_exporter ] && (nohup /opt/rc/bin/frr_exporter --web.listen-address=:9342 >/var/log/frr_exporter.log 2>&1 &) || true'
      user: root

    # ── Endpoint hosts (Alpine) ──────────────────────────────────────
    dc-west-host-a:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.254.255.31
      binds:
        - configs/hosts/dc-west/dc-west-host-a.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-west-host-b:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.254.255.32
      binds:
        - configs/hosts/dc-west/dc-west-host-b.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-west-host-c:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.254.255.33
      binds:
        - configs/hosts/dc-west/dc-west-host-c.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-west-host-d:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.254.255.34
      binds:
        - configs/hosts/dc-west/dc-west-host-d.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

  # ── Links ──────────────────────────────────────────────────────────
  links:

    # Spine-leaf underlay (OSPF + eBGP)
    - endpoints: ["dc-west-spine1:eth1", "dc-west-leaf1:eth1"]
    - endpoints: ["dc-west-spine1:eth2", "dc-west-leaf2:eth1"]
    - endpoints: ["dc-west-spine1:eth3", "dc-west-leaf3:eth1"]
    - endpoints: ["dc-west-spine1:eth4", "dc-west-leaf4:eth1"]

    - endpoints: ["dc-west-spine2:eth1", "dc-west-leaf1:eth2"]
    - endpoints: ["dc-west-spine2:eth2", "dc-west-leaf2:eth2"]
    - endpoints: ["dc-west-spine2:eth3", "dc-west-leaf3:eth2"]
    - endpoints: ["dc-west-spine2:eth4", "dc-west-leaf4:eth2"]

    # Spine-to-spine (iBGP + OSPF)
    - endpoints: ["dc-west-spine1:eth5", "dc-west-spine2:eth5"]

    # WAN edge uplinks to spines
    - endpoints: ["dc-west-spine1:eth6", "wan-west:eth1"]
    - endpoints: ["dc-west-spine2:eth6", "wan-west:eth2"]

    # Leaf-to-host links (access ports)
    - endpoints: ["dc-west-leaf1:eth3", "dc-west-host-a:eth1"]
    - endpoints: ["dc-west-leaf2:eth3", "dc-west-host-b:eth1"]
    - endpoints: ["dc-west-leaf3:eth3", "dc-west-host-c:eth1"]
    - endpoints: ["dc-west-leaf4:eth3", "dc-west-host-d:eth1"]
