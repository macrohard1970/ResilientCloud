    # ══════════════════════════════════════════════════════════════════
    # Cross-region groups (all spines, all leaves, all WAN edges)
    # ══════════════════════════════════════════════════════════════════
    all_spines:
      children:
        dc_east_spines:
        dc_west_spines:
        dc_eu_spines:

    all_leaves:
      children:
        dc_east_leaves:
        dc_west_leaves:
        dc_eu_leaves:

    all_wan_edges:
      children:
        dc_east_wan:
        dc_west_wan:
        dc_eu_wan:

  # ── Global vars ────────────────────────────────────────────────────
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
    frr_vtysh: "vtysh"
