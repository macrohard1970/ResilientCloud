---
# Applies to every FRR node (spines, leaves, WAN edges) in both inventories.
# Per-device configuration lives in configs/frr/<inventory_hostname>/.
frr_config_dir: /etc/frr
frr_reload_cmd: /usr/lib/frr/frr-reload.py --reload /etc/frr/frr.conf
frr_daemons: [zebra, bgpd, ospfd, bfdd, staticd]
ospf_area: 0
ospf_network_type: point-to-point
bgp_update_source: lo
bgp_ebgp_multihop: 2
bfd_profile: FABRIC
