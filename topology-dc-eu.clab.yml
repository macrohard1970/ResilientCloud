# Containerlab topology: DC-EU (eu-west-1)
# 2 spines + 4 leaves (FRR), 4 endpoint hosts (Alpine), 1 WAN edge router (FRR)
#
# Deploy:   containerlab deploy -t topology-dc-eu.clab.yml
# Destroy:  containerlab destroy -t topology-dc-eu.clab.yml --cleanup
# Inspect:  containerlab inspect -t topology-dc-eu.clab.yml

name: netlab-eu

# Container names equal node names (e.g. dc-east-spine1), unique across regions.
prefix: ""

# ── Management network ────────────────────────────────────────────────
mgmt:
  network: clab-netlab-eu-mgmt
  ipv4-subnet: 10.253.255.0/24

# ── Topology nodes ───────────────────────────────────────────────────
topology:
  nodes:

    # ── Spines (FRR, AS 65001) ────────────────────────────────────────
    dc-eu-spine1:
      kind: linux
      image: frrouting/frr:10.2.1
      mgmt-ipv4: 10.253.255.11
      binds:
        - configs/frr/dc-eu-spine1/daemons:/etc/frr/daemons
        - configs/frr/dc-eu-spine1/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-eu-spine1/vtysh.conf:/etc/frr/vtysh.conf
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        - /usr/lib/frr/frrinit.sh start
      user: root

    dc-eu-spine2:
      kind: linux
      image: frrouting/frr:10.2.1
      mgmt-ipv4: 10.253.255.12
      binds:
        - configs/frr/dc-eu-spine2/daemons:/etc/frr/daemons
        - configs/frr/dc-eu-spine2/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-eu-spine2/vtysh.conf:/etc/frr/vtysh.conf
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        - /usr/lib/frr/frrinit.sh start
      user: root

    # ── Leaves (FRR, unique ASNs per leaf) ───────────────────────────
    dc-eu-leaf1:
      kind: linux
      image: frrouting/frr:10.2.1
      mgmt-ipv4: 10.253.255.21
      binds:
        - configs/frr/dc-eu-leaf1/daemons:/etc/frr/daemons
        - configs/frr/dc-eu-leaf1/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-eu-leaf1/vtysh.conf:/etc/frr/vtysh.conf
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        - /usr/lib/frr/frrinit.sh start
      user: root

    dc-eu-leaf2:
      kind: linux
      image: frrouting/frr:10.2.1
      mgmt-ipv4: 10.253.255.22
      binds:
        - configs/frr/dc-eu-leaf2/daemons:/etc/frr/daemons
        - configs/frr/dc-eu-leaf2/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-eu-leaf2/vtysh.conf:/etc/frr/vtysh.conf
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        - /usr/lib/frr/frrinit.sh start
      user: root

    dc-eu-leaf3:
      kind: linux
      image: frrouting/frr:10.2.1
      mgmt-ipv4: 10.253.255.23
      binds:
        - configs/frr/dc-eu-leaf3/daemons:/etc/frr/daemons
        - configs/frr/dc-eu-leaf3/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-eu-leaf3/vtysh.conf:/etc/frr/vtysh.conf
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        - /usr/lib/frr/frrinit.sh start
      user: root

    dc-eu-leaf4:
      kind: linux
      image: frrouting/frr:10.2.1
      mgmt-ipv4: 10.253.255.24
      binds:
        - configs/frr/dc-eu-leaf4/daemons:/etc/frr/daemons
        - configs/frr/dc-eu-leaf4/frr.conf:/etc/frr/frr.conf
        - configs/frr/dc-eu-leaf4/vtysh.conf:/etc/frr/vtysh.conf
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
      exec:
        - /usr/lib/frr/frrinit.sh start
      user: root

    # ── WAN edge router (FRR, AS 65030) ──────────────────────────────
    wan-eu:
      kind: linux
      image: frrouting/frr:10.2.1
      mgmt-ipv4: 10.253.255.50
      binds:
        - configs/frr/wan-eu/daemons:/etc/frr/daemons
        - configs/frr/wan-eu/frr.conf:/etc/frr/frr.conf
        - configs/frr/wan-eu/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/wan-eu/tunnels.sh:/tunnels.sh
      env:
        FRR_ENABLE_ZEBRA: "yes"
        FRR_ENABLE_OSPFD: "yes"
        FRR_ENABLE_BGPD: "yes"
        LOCAL_IP: ""
        REMOTE_EAST: ""
        REMOTE_WEST: ""
      exec:
        - sh /tunnels.sh
        - /usr/lib/frr/frrinit.sh start
      user: root

    # ── Endpoint hosts (Alpine) ──────────────────────────────────────
    dc-eu-host-a:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.253.255.31
      binds:
        - configs/hosts/dc-eu/dc-eu-host-a.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-eu-host-b:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.253.255.32
      binds:
        - configs/hosts/dc-eu/dc-eu-host-b.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-eu-host-c:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.253.255.33
      binds:
        - configs/hosts/dc-eu/dc-eu-host-c.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

    dc-eu-host-d:
      kind: linux
      image: alpine:3.20
      mgmt-ipv4: 10.253.255.34
      binds:
        - configs/hosts/dc-eu/dc-eu-host-d.init.sh:/init.sh
      exec:
        - sh /init.sh
      user: root

  # ── Links ──────────────────────────────────────────────────────────
  links:

    # Spine-leaf underlay (OSPF + eBGP)
    - endpoints: ["dc-eu-spine1:eth1", "dc-eu-leaf1:eth1"]
    - endpoints: ["dc-eu-spine1:eth2", "dc-eu-leaf2:eth1"]
    - endpoints: ["dc-eu-spine1:eth3", "dc-eu-leaf3:eth1"]
    - endpoints: ["dc-eu-spine1:eth4", "dc-eu-leaf4:eth1"]

    - endpoints: ["dc-eu-spine2:eth1", "dc-eu-leaf1:eth2"]
    - endpoints: ["dc-eu-spine2:eth2", "dc-eu-leaf2:eth2"]
    - endpoints: ["dc-eu-spine2:eth3", "dc-eu-leaf3:eth2"]
    - endpoints: ["dc-eu-spine2:eth4", "dc-eu-leaf4:eth2"]

    # Spine-to-spine (iBGP + OSPF)
    - endpoints: ["dc-eu-spine1:eth5", "dc-eu-spine2:eth5"]

    # WAN edge uplinks to spines
    - endpoints: ["dc-eu-spine1:eth6", "wan-eu:eth1"]
    - endpoints: ["dc-eu-spine2:eth6", "wan-eu:eth2"]

    # Leaf-to-host links (access ports)
    - endpoints: ["dc-eu-leaf1:eth3", "dc-eu-host-a:eth1"]
    - endpoints: ["dc-eu-leaf2:eth3", "dc-eu-host-b:eth1"]
    - endpoints: ["dc-eu-leaf3:eth3", "dc-eu-host-c:eth1"]
    - endpoints: ["dc-eu-leaf4:eth3", "dc-eu-host-d:eth1"]
