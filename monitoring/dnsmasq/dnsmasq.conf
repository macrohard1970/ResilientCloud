# dnsmasq configuration for the lab network

# DNS settings
domain-needed
bogus-priv
no-resolv
server=8.8.8.8
server=1.1.1.1

# Lab domain
domain=netlab.local
local=/netlab.local/

# Use /etc/hosts.lab for static entries
addn-hosts=/etc/hosts.lab

# DHCP ranges (if needed for host containers)
# dhcp-range=10.10.1.100,10.10.1.200,24h

# Log
log-queries
