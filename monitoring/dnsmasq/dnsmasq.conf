# dnsmasq — lab name resolution (optional 'dns' compose profile).
# Names come from hosts.<region>, e.g. dc-east-spine1.lab.internal.
domain-needed
bogus-priv
no-resolv
no-hosts
# Upstream: Amazon-provided VPC DNS (works on EC2 and from containers there)
server=169.254.169.253
domain=lab.internal
local=/lab.internal/
addn-hosts=/etc/hosts.lab
log-queries
