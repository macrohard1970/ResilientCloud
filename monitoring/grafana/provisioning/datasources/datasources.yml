# Grafana provisioning — datasources
# Auto-configures Prometheus as the default data source on startup

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Suzieq
    type: suzieq
    access: proxy
    url: http://suzieq:8000
    editable: true
