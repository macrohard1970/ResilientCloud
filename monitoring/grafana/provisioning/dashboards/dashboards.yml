# Grafana provisioning — dashboards
# Add dashboard JSON files to the dashboards/ directory

apiVersion: 1

providers:
  - name: "Lab Dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
