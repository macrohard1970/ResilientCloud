# ResilientCloud monitoring stack — one instance per region.
#
#   docker compose --env-file env/dc-east.env up -d                 # Prometheus + Grafana
#   docker compose --env-file env/dc-east.env --profile batfish up -d   # + Batfish
#   docker compose --env-file env/dc-east.env --profile dns up -d       # + dnsmasq
#   docker compose --env-file env/dc-east.env --profile suzieq up -d    # + SuzieQ (needs sshd on nodes)
#   docker compose --env-file env/dc-east.env down
#
# Start the region's Containerlab topology first: it creates ${MGMT_NET}.
# Only Prometheus and Grafana run by default to keep the EC2 host small.
# Published ports bind to 127.0.0.1; reach them with an SSH tunnel.

name: rc-${REGION:?set REGION via --env-file env/<region>.env}-monitoring

networks:
  services:
    name: rc-${REGION}-services
    ipam:
      config:
        - subnet: ${SVC_SUBNET}
  mgmt:
    name: ${MGMT_NET}
    external: true

volumes:
  prometheus_data:
  grafana_data:
  suzieq_data:

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: rc-${REGION}-prometheus
    restart: unless-stopped
    networks:
      services: {ipv4_address: "${SVC_PREFIX}.10"}
      mgmt: {ipv4_address: "${MGMT_PREFIX}.41"}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets/${REGION}.yml:/etc/prometheus/targets/frr.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT}:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: rc-${REGION}-grafana
    restart: unless-stopped
    networks:
      services: {ipv4_address: "${SVC_PREFIX}.11"}
      mgmt: {ipv4_address: "${MGMT_PREFIX}.42"}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # Override with: export GRAFANA_ADMIN_PASSWORD=...  (lab default: admin)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus

  # ── Optional ────────────────────────────────────────────────────────

  suzieq:
    profiles: [suzieq]
    image: netenglabs/suzieq:0.25.0
    container_name: rc-${REGION}-suzieq
    restart: unless-stopped
    networks:
      services: {ipv4_address: "${SVC_PREFIX}.12"}
      mgmt: {ipv4_address: "${MGMT_PREFIX}.43"}
    volumes:
      - suzieq_data:/home/suzieq/parquet
      - ./suzieq/inventory.${REGION}.yml:/home/suzieq/inventory.yml:ro
      - ./suzieq/ssh:/home/suzieq/.ssh:ro
    command: ["sq-poller", "-I", "/home/suzieq/inventory.yml"]

  batfish:
    profiles: [batfish]
    image: batfish/batfish:latest
    container_name: rc-${REGION}-batfish
    restart: unless-stopped
    networks:
      services: {ipv4_address: "${SVC_PREFIX}.13"}
    ports:
      - "127.0.0.1:${BATFISH_PORT}:9996"   # pybatfish API

  dnsmasq:
    profiles: [dns]
    image: alpine:3.20
    container_name: rc-${REGION}-dnsmasq
    restart: unless-stopped
    networks:
      services: {ipv4_address: "${SVC_PREFIX}.15"}
      mgmt: {ipv4_address: "${MGMT_PREFIX}.46"}
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./dnsmasq/hosts.${REGION}:/etc/hosts.lab:ro
    # No host port: lab containers query it on ${MGMT_PREFIX}.46. Publishing :53
    # on the EC2 host would clash with the host's own resolver.
    command: ["sh", "-c", "apk add --no-cache dnsmasq >/dev/null && exec dnsmasq --keep-in-foreground --conf-file=/etc/dnsmasq.conf"]
