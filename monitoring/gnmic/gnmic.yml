# gNMIc configuration
# Subscribes to gNMI telemetry from FRR nodes and exports metrics to Prometheus

username: admin
password: admin
skip-verify: true
encoding: json_ietf
log: true

# Prometheus metrics exporter
prometheus:
  listen: :9804
  metric-rename:
    - from: '/interfaces/interface/state/counters/(\w+)'
      to: '$1'
    - from: '/network-instances/.*'
      to: 'routing'

# FRR nodes (via management IP, gNMI port 57400)
# FRR's built-in gNMI server must be enabled in the daemons file
# (add 'mgmtd=yes' and configure gNMI server port if using FRR 10+ with gNMI support)
# For now, gNMIc can also poll via SNMP or SSH if gNMI is not available.
#
# If FRR gNMI is not enabled, replace with SSH-based collectors or
# Telegraf for SNMP polling. gNMIc supports multiple output formats.
subscriptions:
  - name: interface-counters
    paths:
      - /interfaces/interface/state/counters
    stream-mode: sample
    sample-interval: 10s

  - name: bgp-state
    paths:
      - /network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state
    stream-mode: sample
    sample-interval: 10s

targets:
  # Comment these out if FRR gNMI server is not enabled
  # Enable by adding 'mgmtd=yes' to daemons file and configuring gNMI port
  # spine1:
  #   address: 10.255.255.11:57400
  # spine2:
  #   address: 10.255.255.12:57400
  # leaf1:
  #   address: 10.255.255.21:57400
  # leaf2:
  #   address: 10.255.255.22:57400
  # leaf3:
  #   address: 10.255.255.23:57400
  # leaf4:
  #   address: 10.255.255.24:57400
