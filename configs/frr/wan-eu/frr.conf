frr version 8.4
frr defaults traditional
hostname wan-eu
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.253.0.100/32
!
interface eth1
 ip address 10.200.0.19/31
!
interface eth2
 ip address 10.200.0.21/31
!
interface tun-east
 ip address 10.110.0.6/30
!
interface tun-west
 ip address 10.110.0.10/30
!
ip route 10.255.0.100/32 10.110.0.5
ip route 10.254.0.100/32 10.110.0.9
ip route 10.12.0.0/16 Null0
!
ip prefix-list WAN-OUT seq 5 permit 10.12.0.0/16 le 24
ip prefix-list WAN-OUT seq 10 permit 10.253.0.0/24 le 32
ip prefix-list WAN-OUT seq 20 deny 0.0.0.0/0 le 32
!
ip prefix-list WAN-IN seq 5 permit 10.10.0.0/16 le 24
ip prefix-list WAN-IN seq 10 permit 10.11.0.0/16 le 24
ip prefix-list WAN-IN seq 15 permit 10.255.0.0/24 le 32
ip prefix-list WAN-IN seq 20 permit 10.254.0.0/24 le 32
ip prefix-list WAN-IN seq 30 deny 0.0.0.0/0 le 32
!
router ospf
 ospf router-id 10.253.0.100
 passive-interface lo
 network 10.253.0.0/24 area 0
 network 10.200.0.0/24 area 0
!
router bgp 65030
 bgp router-id 10.253.0.100
 no bgp ebgp-requires-policy
 neighbor 10.253.0.1 remote-as 65001
 neighbor 10.253.0.1 update-source lo
 neighbor 10.253.0.1 ebgp-multihop 2
 neighbor 10.253.0.1 next-hop-self
 neighbor 10.253.0.1 bfd
 neighbor 10.253.0.2 remote-as 65001
 neighbor 10.253.0.2 update-source lo
 neighbor 10.253.0.2 ebgp-multihop 2
 neighbor 10.253.0.2 next-hop-self
 neighbor 10.253.0.2 bfd
 neighbor 10.255.0.100 remote-as 65010
 neighbor 10.255.0.100 update-source lo
 neighbor 10.255.0.100 ebgp-multihop 5
 neighbor 10.255.0.100 timers 3 9
 neighbor 10.255.0.100 bfd
 neighbor 10.255.0.100 next-hop-self
 neighbor 10.255.0.100 prefix-list WAN-IN in
 neighbor 10.255.0.100 prefix-list WAN-OUT out
 neighbor 10.254.0.100 remote-as 65020
 neighbor 10.254.0.100 update-source lo
 neighbor 10.254.0.100 ebgp-multihop 5
 neighbor 10.254.0.100 timers 3 9
 neighbor 10.254.0.100 bfd
 neighbor 10.254.0.100 next-hop-self
 neighbor 10.254.0.100 prefix-list WAN-IN in
 neighbor 10.254.0.100 prefix-list WAN-OUT out
 network 10.253.0.100/32
 network 10.12.0.0/16
!
bfd
peer 10.253.0.1
!
peer 10.253.0.2
!
peer 10.255.0.100
!
peer 10.254.0.100
!
line vty
!
