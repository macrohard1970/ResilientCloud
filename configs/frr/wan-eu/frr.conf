!
! FRR configuration — wan-eu
! AS 65030 | Router ID 10.253.0.100
! Role: WAN edge router for DC-EU
!
! Peers:
!   Local fabric:  dc-eu-spine1 / dc-eu-spine2 (AS 65001), eBGP between loopbacks
!   Inter-region:  wan-east (AS 65010) via tun-east, wan-west (AS 65020) via tun-west
!
! GRE tunnel interfaces are created by tunnels.sh (Containerlab exec).
! FRR applies the addresses below as soon as the interfaces appear.
!
frr version 10.2.1
frr defaults traditional
hostname wan-eu
log syslog informational
service integrated-vtysh-config
!
! ── Interfaces ──────────────────────────────────────────────────────
!
interface lo
 ip address 10.253.0.100/32
 ip ospf passive
!
! Uplink to dc-eu-spine1 (underlay)
interface eth1
 ip address 10.200.0.19/31
 ip ospf network point-to-point
!
! Uplink to dc-eu-spine2 (underlay)
interface eth2
 ip address 10.200.0.21/31
 ip ospf network point-to-point
!
! GRE to wan-east (remote end 10.110.0.5)
interface tun-east
 ip address 10.110.0.6/30
!
! GRE to wan-west (remote end 10.110.0.9)
interface tun-west
 ip address 10.110.0.10/30
!
! ── OSPF (underlay: uplinks + loopback; tunnels are NOT in OSPF) ───
!
router ospf
 ospf router-id 10.253.0.100
 network 10.253.0.100/32 area 0
 network 10.200.0.18/31 area 0
 network 10.200.0.20/31 area 0
!
! ── Static routes to remote WAN edge loopbacks (BGP peering over GRE) ─
!
ip route 10.255.0.100/32 10.110.0.5
ip route 10.254.0.100/32 10.110.0.9
!
! ── Route policy ────────────────────────────────────────────────────
! Only /16 region aggregates cross the WAN. Individual /24s, loopbacks and
! underlay links stay inside each fabric.
!   WAN-OUT    : own aggregate + remote aggregates (transit for failover)
!   WAN-IN     : remote aggregates only
!   FABRIC-OUT : remote aggregates only (fabric already has local /24s)
!
ip prefix-list LOCAL-AGG seq 5 permit 10.12.0.0/16
ip prefix-list REMOTE-AGG seq 5 permit 10.10.0.0/16
ip prefix-list REMOTE-AGG seq 10 permit 10.11.0.0/16
!
route-map WAN-OUT permit 10
 match ip address prefix-list LOCAL-AGG
exit
route-map WAN-OUT permit 20
 match ip address prefix-list REMOTE-AGG
exit
!
route-map WAN-IN permit 10
 match ip address prefix-list REMOTE-AGG
exit
!
route-map FABRIC-OUT permit 10
 match ip address prefix-list REMOTE-AGG
exit
!
! ── BGP ──────────────────────────────────────────────────────────────
!
router bgp 65030
 bgp router-id 10.253.0.100
 no bgp ebgp-requires-policy
 !
 ! eBGP to dc-eu-spine1 (AS 65001) — loopback peering
 neighbor 10.253.0.1 remote-as 65001
 neighbor 10.253.0.1 update-source lo
 neighbor 10.253.0.1 ebgp-multihop 2
 neighbor 10.253.0.1 bfd profile FABRIC
 !
 ! eBGP to dc-eu-spine2 (AS 65001) — loopback peering
 neighbor 10.253.0.2 remote-as 65001
 neighbor 10.253.0.2 update-source lo
 neighbor 10.253.0.2 ebgp-multihop 2
 neighbor 10.253.0.2 bfd profile FABRIC
 !
 ! eBGP to wan-east (AS 65010) — over tun-east, loopback peering
 neighbor 10.255.0.100 remote-as 65010
 neighbor 10.255.0.100 update-source lo
 neighbor 10.255.0.100 ebgp-multihop 2
 neighbor 10.255.0.100 timers 3 9
 neighbor 10.255.0.100 timers connect 5
 neighbor 10.255.0.100 bfd profile WAN
 !
 ! eBGP to wan-west (AS 65020) — over tun-west, loopback peering
 neighbor 10.254.0.100 remote-as 65020
 neighbor 10.254.0.100 update-source lo
 neighbor 10.254.0.100 ebgp-multihop 2
 neighbor 10.254.0.100 timers 3 9
 neighbor 10.254.0.100 timers connect 5
 neighbor 10.254.0.100 bfd profile WAN
 !
 address-family ipv4 unicast
  ! Region aggregate (built from the /24s the spines advertise;
  ! FRR also installs a discard route for it)
  aggregate-address 10.12.0.0/16
  !
  neighbor 10.253.0.1 activate
  neighbor 10.253.0.1 next-hop-self
  neighbor 10.253.0.1 route-map FABRIC-OUT out
  neighbor 10.253.0.2 activate
  neighbor 10.253.0.2 next-hop-self
  neighbor 10.253.0.2 route-map FABRIC-OUT out
  neighbor 10.255.0.100 activate
  neighbor 10.255.0.100 route-map WAN-IN in
  neighbor 10.255.0.100 route-map WAN-OUT out
  neighbor 10.254.0.100 activate
  neighbor 10.254.0.100 route-map WAN-IN in
  neighbor 10.254.0.100 route-map WAN-OUT out
 exit-address-family
exit
!
! ── BFD ─────────────────────────────────────────────────────────────
!
bfd
 profile FABRIC
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
 profile WAN
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
