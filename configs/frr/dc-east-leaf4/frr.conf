!
! FRR configuration — dc-east-leaf4
! AS 65104 | Router ID 10.255.0.14
! Role: Leaf, eBGP to spine1+spine2, advertises host-d subnet 10.10.4.0/24
!
frr version 10.2.1
frr defaults traditional
hostname dc-east-leaf4
log syslog informational
service integrated-vtysh-config
!
! ── Interfaces ──────────────────────────────────────────────────────
!
interface lo
 ip address 10.255.0.14/32
 ip ospf passive
!
! Uplink to spine1
interface eth1
 ip address 10.99.0.7/31
 ip ospf network point-to-point
!
! Uplink to spine2
interface eth2
 ip address 10.99.0.15/31
 ip ospf network point-to-point
!
! Downlink to host-d (not in OSPF — advertised via BGP)
interface eth3
 ip address 10.10.4.254/24
!
! ── OSPF (underlay — uplinks + loopback only) ──────────────────────
!
router ospf
 ospf router-id 10.255.0.14
 network 10.255.0.14/32 area 0
 network 10.99.0.6/31 area 0
 network 10.99.0.14/31 area 0
!
! ── BGP (overlay) ──────────────────────────────────────────────────
!
router bgp 65104
 bgp router-id 10.255.0.14
 no bgp ebgp-requires-policy
 !
 ! eBGP to spine1 (AS 65001)
 neighbor 10.255.0.1 remote-as 65001
 neighbor 10.255.0.1 update-source lo
 neighbor 10.255.0.1 bfd profile FABRIC
 neighbor 10.255.0.1 ebgp-multihop 2
 !
 ! eBGP to spine2 (AS 65001)
 neighbor 10.255.0.2 remote-as 65001
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.2 bfd profile FABRIC
 neighbor 10.255.0.2 ebgp-multihop 2
 !
 address-family ipv4 unicast
  ! Advertise connected host subnet
  network 10.10.4.0/24
  ! Advertise own loopback
  network 10.255.0.14/32
  !
  neighbor 10.255.0.1 activate
  neighbor 10.255.0.2 activate
 exit-address-family
!
! ── BFD (fast failure detection) ───────────────────────────────────
! bgpd creates a BFD session for every neighbor with "bfd profile" set.
! Loopback-to-loopback BGP sessions automatically use multihop BFD.
!
bfd
 profile FABRIC
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
