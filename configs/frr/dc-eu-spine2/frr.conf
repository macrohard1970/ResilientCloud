frr version 10.2.1
frr defaults traditional
hostname dc-eu-spine2
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.253.0.2/32
 ip ospf passive
!
interface eth1
 ip address 10.200.0.8/31
!
interface eth2
 ip address 10.200.0.10/31
!
interface eth3
 ip address 10.200.0.12/31
!
interface eth4
 ip address 10.200.0.14/31
!
interface eth5
 ip address 10.200.0.17/31
!
interface eth6
 ip address 10.200.0.20/31
!
router ospf
 ospf router-id 10.253.0.2
 network 10.253.0.0/24 area 0
 network 10.200.0.0/24 area 0
!
router bgp 65001
 bgp router-id 10.253.0.2
 no bgp ebgp-requires-policy
 neighbor 10.253.0.1 remote-as 65001
 neighbor 10.253.0.1 update-source lo
 neighbor 10.253.0.1 bfd
 neighbor 10.253.0.1 next-hop-self
 neighbor 10.253.0.11 remote-as 65101
 neighbor 10.253.0.11 update-source lo
 neighbor 10.253.0.11 bfd profile FABRIC
 neighbor 10.253.0.11 ebgp-multihop 2
 neighbor 10.253.0.11 next-hop-self
 neighbor 10.253.0.12 remote-as 65102
 neighbor 10.253.0.12 update-source lo
 neighbor 10.253.0.12 bfd profile FABRIC
 neighbor 10.253.0.12 ebgp-multihop 2
 neighbor 10.253.0.12 next-hop-self
 neighbor 10.253.0.13 remote-as 65103
 neighbor 10.253.0.13 update-source lo
 neighbor 10.253.0.13 bfd profile FABRIC
 neighbor 10.253.0.13 ebgp-multihop 2
 neighbor 10.253.0.13 next-hop-self
 neighbor 10.253.0.14 remote-as 65104
 neighbor 10.253.0.14 update-source lo
 neighbor 10.253.0.14 bfd profile FABRIC
 neighbor 10.253.0.14 ebgp-multihop 2
 neighbor 10.253.0.14 next-hop-self
 neighbor 10.253.0.100 remote-as 65030
 neighbor 10.253.0.100 update-source lo
 neighbor 10.253.0.100 bfd profile FABRIC
 neighbor 10.253.0.100 ebgp-multihop 2
 neighbor 10.253.0.100 next-hop-self
!
bfd
peer 10.253.0.1
!
line vty
!
