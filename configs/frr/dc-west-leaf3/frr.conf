!
! FRR configuration — dc-west-leaf3
! AS 65103 | Router ID 10.254.0.13
! Role: Leaf, eBGP to spine1+spine2, advertises host subnet 10.11.3.0/24
!
frr version 10.2.1
frr defaults traditional
hostname dc-west-leaf3
log syslog informational
service integrated-vtysh-config
!
! ── Interfaces ──────────────────────────────────────────────────────
!
interface lo
 ip address 10.254.0.13/32
!
! Uplink to spine1
interface eth1
 ip address 10.100.0.5/31
 ip ospf network point-to-point
!
! Uplink to spine2
interface eth2
 ip address 10.100.0.13/31
 ip ospf network point-to-point
!
! Downlink to host (not in OSPF — advertised via BGP)
interface eth3
 ip address 10.11.3.254/24
!
! ── OSPF (underlay — uplinks + loopback only) ──────────────────────
!
router ospf
 ospf router-id 10.254.0.13
 passive-interface lo
 network 10.254.0.13/32 area 0
 network 10.100.0.5/31 area 0
 network 10.100.0.13/31 area 0
!
! ── BGP (overlay) ──────────────────────────────────────────────────
!
router bgp 65103
 bgp router-id 10.254.0.13
 no bgp ebgp-requires-policy
 no bgp network import-check
 !
 ! eBGP to spine1 (AS 65001)
 neighbor 10.254.0.1 remote-as 65001
 neighbor 10.254.0.1 update-source lo
 neighbor 10.254.0.1 ebgp-multihop 2
 !
 ! eBGP to spine2 (AS 65001)
 neighbor 10.254.0.2 remote-as 65001
 neighbor 10.254.0.2 update-source lo
 neighbor 10.254.0.2 ebgp-multihop 2
 !
 address-family ipv4 unicast
  ! Advertise connected host subnet
  network 10.11.3.0/24
  ! Advertise own loopback
  network 10.254.0.13/32
  !
  neighbor 10.254.0.1 activate
  neighbor 10.254.0.2 activate
 exit-address-family
!
! ── BFD (fast failure detection) ───────────────────────────────────
!
bfd
 peer 10.254.0.1
  minimum-ttl 1
 !
 peer 10.254.0.2
  minimum-ttl 1
 !
!
