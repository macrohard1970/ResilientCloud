frr version 8.4
frr defaults traditional
hostname dc-eu-leaf3
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
interface lo
 ip address 10.253.0.13/32
!
interface eth1
 ip address 10.200.0.5/31
!
interface eth2
 ip address 10.200.0.13/31
!
interface eth3
 ip address 10.12.3.254/24
!
router ospf
 ospf router-id 10.253.0.13
 passive-interface lo
 network 10.253.0.0/24 area 0
 network 10.200.0.0/24 area 0
!
router bgp 65103
 bgp router-id 10.253.0.13
 no bgp ebgp-requires-policy
 neighbor 10.253.0.1 remote-as 65001
 neighbor 10.253.0.1 update-source lo
 neighbor 10.253.0.1 ebgp-multihop 2
 neighbor 10.253.0.1 bfd
 neighbor 10.253.0.2 remote-as 65001
 neighbor 10.253.0.2 update-source lo
 neighbor 10.253.0.2 ebgp-multihop 2
 neighbor 10.253.0.2 bfd
 network 10.12.3.0/24
 network 10.253.0.13/32
!
bfd
peer 10.253.0.1
!
peer 10.253.0.2
!
line vty
!
