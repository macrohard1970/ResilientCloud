!
! FRR configuration — dc-west-spine2
! AS 65001 | Router ID 10.254.0.2
! Role: Spine layer, OSPF area 0, iBGP to spine1, route-reflector for leaves
!
frr version 10.2.1
frr defaults traditional
hostname dc-west-spine2
log syslog informational
service integrated-vtysh-config
!
! ── Interfaces ──────────────────────────────────────────────────────
!
interface lo
 ip address 10.254.0.2/32
!
interface eth1
 ip address 10.100.0.8/31
 ip ospf network point-to-point
!
interface eth2
 ip address 10.100.0.10/31
 ip ospf network point-to-point
!
interface eth3
 ip address 10.100.0.12/31
 ip ospf network point-to-point
!
interface eth4
 ip address 10.100.0.14/31
 ip ospf network point-to-point
!
interface eth5
 ip address 10.100.0.17/31
 ip ospf network point-to-point
!
! WAN edge uplink (multi-region expansion)
interface eth6
 ip address 10.100.0.20/31
 ip ospf network point-to-point
!
! ── OSPF (underlay) ────────────────────────────────────────────────
!
router ospf
 ospf router-id 10.254.0.2
 passive-interface lo
 network 10.254.0.2/32 area 0
 network 10.100.0.8/31 area 0
 network 10.100.0.10/31 area 0
 network 10.100.0.12/31 area 0
 network 10.100.0.14/31 area 0
 network 10.100.0.17/31 area 0
 network 10.100.0.20/31 area 0
!
! ── BGP (overlay) ──────────────────────────────────────────────────
!
router bgp 65001
 bgp router-id 10.254.0.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 !
 ! iBGP to spine1 (same AS, loopback peering)
 neighbor 10.254.0.1 remote-as 65001
 neighbor 10.254.0.1 update-source lo
 !
 ! eBGP to leaves (different ASNs, loopback peering with multihop)
 neighbor 10.254.0.11 remote-as 65101
 neighbor 10.254.0.11 update-source lo
 neighbor 10.254.0.11 ebgp-multihop 2
 !
 neighbor 10.254.0.12 remote-as 65102
 neighbor 10.254.0.12 update-source lo
 neighbor 10.254.0.12 ebgp-multihop 2
 !
 neighbor 10.254.0.13 remote-as 65103
 neighbor 10.254.0.13 update-source lo
 neighbor 10.254.0.13 ebgp-multihop 2
 !
 neighbor 10.254.0.14 remote-as 65104
 neighbor 10.254.0.14 update-source lo
 neighbor 10.254.0.14 ebgp-multihop 2
 !
 ! eBGP to WAN edge router (multi-region expansion)
 neighbor 10.254.0.100 remote-as 65020
 neighbor 10.254.0.100 update-source lo
 neighbor 10.254.0.100 ebgp-multihop 2
 !
 address-family ipv4 unicast
  ! Advertise own loopback
  network 10.254.0.2/32
  !
  ! iBGP neighbor
  neighbor 10.254.0.1 activate
  neighbor 10.254.0.1 next-hop-self
  !
  ! eBGP leaf neighbors — route reflector clients
  neighbor 10.254.0.11 activate
  neighbor 10.254.0.11 route-reflector-client
  neighbor 10.254.0.11 next-hop-self
  !
  neighbor 10.254.0.12 activate
  neighbor 10.254.0.12 route-reflector-client
  neighbor 10.254.0.12 next-hop-self
  !
  neighbor 10.254.0.13 activate
  neighbor 10.254.0.13 route-reflector-client
  neighbor 10.254.0.13 next-hop-self
  !
  neighbor 10.254.0.14 activate
  neighbor 10.254.0.14 route-reflector-client
  neighbor 10.254.0.14 next-hop-self
  !
  ! WAN edge — route-reflector client, injects remote routes
  neighbor 10.254.0.100 activate
  neighbor 10.254.0.100 route-reflector-client
  neighbor 10.254.0.100 next-hop-self
 exit-address-family
!
! ── BFD (fast failure detection) ───────────────────────────────────
!
bfd
 peer 10.254.0.1
  minimum-ttl 1
 !
!
