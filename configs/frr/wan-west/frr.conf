!
! FRR configuration — wan-west
! AS 65020 | Router ID 10.254.0.100
! Role: WAN edge router for DC-West
!
! Peers:
!   Local fabric:  spine1 (AS 65001), spine2 (AS 65001)
!   Inter-region:  wan-east (AS 65010) via GRE tunnel, wan-eu (AS 65030) via GRE tunnel
!
! GRE tunnels are created by the Containerlab topology exec commands.
! Replace REMOTE_EAST_IP and REMOTE_EU_IP with the actual EC2 private IPs
! of the DC-East and DC-EU lab hosts after deployment.
!
frr version 10.2.1
frr defaults traditional
hostname wan-west
log syslog informational
service integrated-vtysh-config
!
! ── Interfaces ──────────────────────────────────────────────────────
!
interface lo
 ip address 10.254.0.100/32
!
! Uplink to spine1 (underlay)
interface eth1
 ip address 10.100.0.19/31
 ip ospf network point-to-point
!
! Uplink to spine2 (underlay)
interface eth2
 ip address 10.100.0.21/31
 ip ospf network point-to-point
!
! ── GRE Tunnels to Remote Regions ──────────────────────────────────
! tun-east: GRE to DC-East EC2 host
! tun-eu:   GRE to DC-EU EC2 host
! Tunnel interfaces are created at Linux level (see topology.clab.yml exec).
! FRR configures IPs and routing on them.
!
interface tun-east
 ip address 10.110.0.2/30
 ip ospf network point-to-point
!
interface tun-eu
 ip address 10.110.0.9/30
 ip ospf network point-to-point
!
! ── OSPF (underlay — uplinks + loopback only) ──────────────────────
! GRE tunnels are NOT in OSPF — BGP carries WAN routes over tunnels.
! Static routes provide reachability to remote WAN edge loopbacks via tunnels.
!
router ospf
 ospf router-id 10.254.0.100
 passive-interface lo
 network 10.254.0.100/32 area 0
 network 10.100.0.19/31 area 0
 network 10.100.0.21/31 area 0
!
! ── Static routes for remote WAN edge loopbacks ────────────────────
! Route remote WAN edge loopbacks through GRE tunnels for BGP peering.
!
ip route 10.255.0.100/32 10.110.0.1
ip route 10.253.0.100/32 10.110.0.10
!
! ── BGP ──────────────────────────────────────────────────────────────
!
router bgp 65020
 bgp router-id 10.254.0.100
 no bgp ebgp-requires-policy
 no bgp network import-check
 !
 ! eBGP to local spine1 (AS 65001) — loopback peering
 neighbor 10.254.0.1 remote-as 65001
 neighbor 10.254.0.1 update-source lo
 neighbor 10.254.0.1 ebgp-multihop 2
 !
 ! eBGP to local spine2 (AS 65001) — loopback peering
 neighbor 10.254.0.2 remote-as 65001
 neighbor 10.254.0.2 update-source lo
 neighbor 10.254.0.2 ebgp-multihop 2
 !
 ! eBGP to DC-East WAN edge (AS 65010) — over GRE tunnel, loopback peering
 neighbor 10.255.0.100 remote-as 65010
 neighbor 10.255.0.100 update-source lo
 neighbor 10.255.0.100 ebgp-multihop 5
 neighbor 10.255.0.100 timers 3 9
 neighbor 10.255.0.100 timers connect 5
 neighbor 10.255.0.100 bfd
 !
 ! eBGP to DC-EU WAN edge (AS 65030) — over GRE tunnel, loopback peering
 neighbor 10.253.0.100 remote-as 65030
 neighbor 10.253.0.100 update-source lo
 neighbor 10.253.0.100 ebgp-multihop 5
 neighbor 10.253.0.100 timers 3 9
 neighbor 10.253.0.100 timers connect 5
 neighbor 10.253.0.100 bfd
 !
 address-family ipv4 unicast
  ! Advertise own loopback
  network 10.254.0.100/32
  !
  ! Advertise DC-West host subnet aggregate to remote WAN edges
  ! Individual /24s are advertised to local spines by the leaves;
  ! the /16 aggregate is advertised to remote regions by the WAN edge.
  network 10.11.0.0/16
  !
  ! Local spine neighbors — inject remote routes into fabric,
  ! receive local fabric routes
  neighbor 10.254.0.1 activate
  neighbor 10.254.0.1 next-hop-self
  neighbor 10.254.0.2 activate
  neighbor 10.254.0.2 next-hop-self
  !
  ! Remote WAN edge neighbors — exchange inter-region routes
  neighbor 10.255.0.100 activate
  neighbor 10.255.0.100 next-hop-self
  neighbor 10.253.0.100 activate
  neighbor 10.253.0.100 next-hop-self
 exit-address-family
!
! ── Route Filtering ─────────────────────────────────────────────────
! Prefix-lists control what is advertised to remote peers.
! Only the local /16 aggregate and /24 loopback range cross the WAN.
! Individual /24 host subnets stay within the local fabric.
!
! To remote WAN edges: advertise only local aggregate + loopbacks
! (Route-map applied to outbound to remote neighbors)
!
! Inbound from remote WAN edges: accept only expected /16 aggregates + /24s
! (Route-map applied to inbound from remote neighbors)
!
! NOTE: Prefix-lists and route-maps are defined but not yet applied.
! Enable them when the full multi-region deployment is operational.
!
! Outbound to remote peers — only advertise local aggregates
! (prevents leaking individual /24s and fabric-internal prefixes)
!
ip prefix-list WAN-OUT seq 5 permit 10.11.0.0/16 le 24
ip prefix-list WAN-OUT seq 10 permit 10.254.0.0/24 le 32
ip prefix-list WAN-OUT seq 100 deny 0.0.0.0/0 le 32
!
! Inbound from remote peers — accept only expected remote aggregates
ip prefix-list WAN-IN seq 5 permit 10.10.0.0/16 le 24
ip prefix-list WAN-IN seq 10 permit 10.12.0.0/16 le 24
ip prefix-list WAN-IN seq 15 permit 10.255.0.0/24 le 32
ip prefix-list WAN-IN seq 20 permit 10.253.0.0/24 le 32
ip prefix-list WAN-IN seq 100 deny 0.0.0.0/0 le 32
!
! ── BFD (fast failure detection) ───────────────────────────────────
!
bfd
 peer 10.254.0.1
  minimum-ttl 1
 !
 peer 10.254.0.2
  minimum-ttl 1
 !
 peer 10.255.0.100
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 !
 peer 10.253.0.100
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 !
!
