!
! FRR configuration — dc-west-spine1
! AS 65001 | Router ID 10.254.0.1
! Role: Spine layer, OSPF area 0, iBGP to peer spine, eBGP to leaves and WAN edge
!
frr version 10.2.1
frr defaults traditional
hostname dc-west-spine1
log syslog informational
service integrated-vtysh-config
!
! ── Interfaces ──────────────────────────────────────────────────────
!
interface lo
 ip address 10.254.0.1/32
 ip ospf passive
!
interface eth1
 ip address 10.100.0.0/31
 ip ospf network point-to-point
!
interface eth2
 ip address 10.100.0.2/31
 ip ospf network point-to-point
!
interface eth3
 ip address 10.100.0.4/31
 ip ospf network point-to-point
!
interface eth4
 ip address 10.100.0.6/31
 ip ospf network point-to-point
!
interface eth5
 ip address 10.100.0.16/31
 ip ospf network point-to-point
!
! WAN edge uplink (multi-region expansion)
interface eth6
 ip address 10.100.0.18/31
 ip ospf network point-to-point
!
! ── OSPF (underlay) ────────────────────────────────────────────────
!
router ospf
 ospf router-id 10.254.0.1
 network 10.254.0.1/32 area 0
 network 10.100.0.0/31 area 0
 network 10.100.0.2/31 area 0
 network 10.100.0.4/31 area 0
 network 10.100.0.6/31 area 0
 network 10.100.0.16/31 area 0
 network 10.100.0.18/31 area 0
!
! ── BGP (overlay) ──────────────────────────────────────────────────
!
router bgp 65001
 bgp router-id 10.254.0.1
 no bgp ebgp-requires-policy
 !
 ! iBGP to spine2 (same AS, loopback peering)
 neighbor 10.254.0.2 remote-as 65001
 neighbor 10.254.0.2 update-source lo
 neighbor 10.254.0.2 bfd profile FABRIC
 !
 ! eBGP to leaves (different ASNs, loopback peering with multihop)
 neighbor 10.254.0.11 remote-as 65101
 neighbor 10.254.0.11 update-source lo
 neighbor 10.254.0.11 bfd profile FABRIC
 neighbor 10.254.0.11 ebgp-multihop 2
 !
 neighbor 10.254.0.12 remote-as 65102
 neighbor 10.254.0.12 update-source lo
 neighbor 10.254.0.12 bfd profile FABRIC
 neighbor 10.254.0.12 ebgp-multihop 2
 !
 neighbor 10.254.0.13 remote-as 65103
 neighbor 10.254.0.13 update-source lo
 neighbor 10.254.0.13 bfd profile FABRIC
 neighbor 10.254.0.13 ebgp-multihop 2
 !
 neighbor 10.254.0.14 remote-as 65104
 neighbor 10.254.0.14 update-source lo
 neighbor 10.254.0.14 bfd profile FABRIC
 neighbor 10.254.0.14 ebgp-multihop 2
 !
 ! eBGP to WAN edge router (multi-region expansion)
 neighbor 10.254.0.100 remote-as 65020
 neighbor 10.254.0.100 update-source lo
 neighbor 10.254.0.100 bfd profile FABRIC
 neighbor 10.254.0.100 ebgp-multihop 2
 !
 address-family ipv4 unicast
  ! Advertise own loopback
  network 10.254.0.1/32
  !
  ! iBGP neighbor
  neighbor 10.254.0.2 activate
  neighbor 10.254.0.2 next-hop-self
  !
  ! eBGP leaf neighbors
  neighbor 10.254.0.11 activate
  neighbor 10.254.0.11 next-hop-self
  !
  neighbor 10.254.0.12 activate
  neighbor 10.254.0.12 next-hop-self
  !
  neighbor 10.254.0.13 activate
  neighbor 10.254.0.13 next-hop-self
  !
  neighbor 10.254.0.14 activate
  neighbor 10.254.0.14 next-hop-self
  !
  ! WAN edge — injects remote-region aggregates
  neighbor 10.254.0.100 activate
  neighbor 10.254.0.100 next-hop-self
 exit-address-family
!
! ── BFD (fast failure detection) ───────────────────────────────────
! bgpd creates a BFD session for every neighbor with "bfd profile" set.
! Loopback-to-loopback BGP sessions automatically use multihop BFD.
!
bfd
 profile FABRIC
  transmit-interval 300
  receive-interval 300
  detect-multiplier 3
 exit
exit
!
